services:
  ghostbit:
    build: .
    # Loopback only: this compose file is the self-hosting sample and the
    # documented topology puts a TLS-terminating reverse proxy in front
    # (docs/self-hosting.md). Publishing on 0.0.0.0 would silently expose the
    # plaintext port to the network. Override BIND_ADDRESS for the rare
    # direct-exposure setup.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    security_opt:
      - no-new-privileges:true
    environment:
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      - SQLITE_PATH=${SQLITE_PATH:-/data/ghostbit.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MAX_PASTE_SIZE=${MAX_PASTE_SIZE:-524288}
      - PORT=${PORT:-8000}
    volumes:
      - ghostbit_data:/data
    # 127.0.0.1, not localhost: busybox wget resolves localhost to [::1], but
    # uvicorn binds IPv4 only (--host 0.0.0.0), so an IPv6 probe is refused.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-8000}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --save 300 1
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # REDISCLI_AUTH instead of `-a <password>`: the -a form expanded the secret
    # into the probe's argv at compose time, visible in the container's process
    # table on every probe. (The `--requirepass` in `command:` above is still
    # argv-visible: Redis offers no env alternative short of a config file;
    # use one, or podman secrets, if that matters in your threat model.)
    healthcheck:
      test: >
        ["CMD", "sh", "-c",
         "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ghostbit_data:
  redis_data:
