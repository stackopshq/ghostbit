name: Test

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "cli/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
  # Pas de filtre `paths` sur les pull requests, contrairement au `push`
  # ci-dessus, et c'est délibéré : `main` est désormais protégée avec
  # `Test / *` en contrôle requis. Un filtre ici ferait qu'une pull request de
  # documentation ne produirait AUCUN contrôle — et une exigence qui n'arrive
  # jamais ne bloque pas la fusion « en attendant », elle la bloque à jamais.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scan on every PR. ─────────────────────────────────────────────────
  # README and CONTRIBUTING promise "the same checks run in CI" about the
  # pre-commit hooks (ruff + gitleaks); until this job, gitleaks only ever ran
  # on machines where the hook was installed — i.e. optionally. Installed from
  # the release tarball with a pinned checksum, same pattern as Trivy in
  # docker.yml: an action would clone github.com with the forge's job token.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # `dir` et non `git` : l'historique porte 24 trouvailles, toutes dans
      # `search/search_index.json` et `api/index.html` de la branche `gh-pages`,
      # c'est-a-dire l'index de recherche et la doc que MkDocs GENERE. Aucune
      # n'est un secret, et surtout aucune n'est corrigeable par l'auteur d'une
      # PR : une garde qui exige de reecrire l'historique est une garde qu'on
      # finit par desactiver. Ce job mesure ce que la PR propose.
      #
      # L'historique reste une question ouverte, mais c'est un audit ponctuel,
      # pas un controle par PR.
      - name: Gitleaks
        run: |
          "${RUNNER_TEMP}/gitleaks" dir . --config .gitleaks.toml \
            --no-banner --redact --exit-code 1

  # ── Lint runs once, no backend dependency. ───────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e cli/

      - name: Ruff check
        run: ruff check app/ tests/ cli/

      - name: Ruff format check
        run: ruff format --check app/ tests/ cli/

  # ── Test matrix: both backends, since prod runs Redis but most local
  #    development uses SQLite — we need either to break the build, not
  #    just the one that happens to match the developer's setup.
  test:
    name: Test (${{ matrix.backend }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, redis]
    # Pas de `ports:` ici, et ce n'est pas un oubli. Sur GitHub chaque job a sa
    # propre machine, donc publier 6379 sur l'hôte est sans conséquence. Sur
    # `core-run-01`, que les huit produits se partagent, un seul job de toute la
    # forge peut tenir ce port : les autres meurent à la création du conteneur,
    # avant même `actions/checkout`, sur `bind: address already in use`. Les deux
    # jambes de cette matrice se percutaient déjà entre elles.
    # Un conteneur de service reste joignable par son NOM sur le réseau du job.
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STORAGE_BACKEND: ${{ matrix.backend }}
      # `redis`, pas `localhost` : les étapes tournent DANS le conteneur de job,
      # donc `localhost` y désigne ce conteneur et jamais le service. La jambe
      # `redis` de la matrice ouvre une vraie connexion (voir la note pytest de
      # `pyproject.toml` sur la boucle d'événements) : cette valeur porte donc
      # le fonctionnement des tests, elle n'est pas décorative.
      REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e cli/

      - name: Pytest
        run: pytest tests/ -v
