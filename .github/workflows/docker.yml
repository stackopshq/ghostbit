name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "**.py"
      - "requirements.txt"
      - "static/**"
      - "templates/**"
      - "app/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  build:
    name: Build & push
    # Le runner `ubuntu-latest` de la forge exécute les jobs DANS un conteneur, sans
    # accès au moteur : `Set up QEMU` y meurt sur « permission denied ... docker.sock »
    # (run 2893). Le runner hôte a podman, et c'est déjà là que ghostcal construit ses
    # images. Sur GitHub, où ce label n'existe pas, ce job ne s'exécute pas, ce qui est
    # sans conséquence : le miroir y est figé et n'a rien construit depuis le 14 août.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # ── Vulnerability + secret + misconfig scan ───────────────────────────
      # Runs before the build so a CVE in requirements.txt or a leaked secret
      # blocks the push entirely. `--ignore-unfixed` keeps the gate actionable:
      # only CVEs that *have* a fix available will fail the job.
      #
      # The binary is fetched directly rather than through aquasecurity/trivy-action:
      # that action checks out the trivy repository with the job's token, and here the
      # job token is a Gitea one, worthless against github.com. Every run since the
      # forge took over died on « could not read Username for 'https://github.com' ».
      # ghostcal solved the same failure with `token-setup-trivy`; a release tarball
      # needs no token at all, which is one dependency fewer for the same scan.
      #
      # Installed under RUNNER_TEMP, not /usr/local/bin: this runner is a long-lived
      # shared machine, and a job has no business leaving binaries on it.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" trivy
          "${RUNNER_TEMP}/trivy" --version

      - name: Trivy scan (filesystem)
        env:
          # ghcr.io rate-limits Trivy DB pulls; AWS's public mirror first, as in ghostcal.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db:2
        run: |
          "${RUNNER_TEMP}/trivy" fs . \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln,secret,misconfig

      # ── Build ─────────────────────────────────────────────────────────────
      # amd64 only, and that is why the moving tags are left alone below:
      # `core-run-01` has neither qemu-user-static nor any binfmt handler
      # (measured 2026-08-31), so it cannot produce the arm64 half that the
      # GitHub build used to publish.
      - name: Build image (Podman)
        run: |
          podman build -t ghostbit:ci . \
            --label org.opencontainers.image.title=Ghostbit \
            --label "org.opencontainers.image.description=Self-hosted, end-to-end encrypted paste service" \
            --label org.opencontainers.image.vendor="StackOps HQ" \
            --label org.opencontainers.image.licenses=Elastic-2.0 \
            --label org.opencontainers.image.documentation=https://docs.ghostbit.dev \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"

      # ── Publish ───────────────────────────────────────────────────────────
      # Only `sha-<short>`, deliberately. `main`, `latest` and the semver tags are
      # multi-architecture as published from GitHub on 2026-08-14, and moving them
      # to an amd64-only image would break every arm64 install that follows them:
      # silently, since a manifest simply stops listing their platform.
      #
      # An immutable tag is also what a deployment should pin: Ansible resolves it
      # to a digest, and an operator can say which build is running.
      #
      # Restoring the moving tags means restoring arm64: install qemu-user-static
      # on core-run-01, then build with `--platform linux/amd64,linux/arm64 --manifest`.
      - name: Publish image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # `ghcr.io/stackopshq/…` spelled out: on this forge `github.repository`
          # is `stackops/ghostbit`, a namespace that does not exist on GitHub.
          IMAGE: ghcr.io/stackopshq/ghostbit
        run: |
          set -euo pipefail
          # GITHUB_TOKEN here is a forge token; ghcr.io answers 403 to it.
          printf '%s' "${GHCR_TOKEN}" \
            | podman login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin
          SHORT="$(git rev-parse --short HEAD)"
          podman tag ghostbit:ci "${IMAGE}:sha-${SHORT}"
          # --digestfile is the registry's digest, written by the push itself.
          # `podman image inspect` prints the LOCAL image digest, which is a
          # different value: pinning it in Apollo makes the pull fail, and it
          # cost two rounds of skopeo inspect on 2026-08-31 to notice.
          podman push --digestfile "${RUNNER_TEMP}/digest" "${IMAGE}:sha-${SHORT}"
          echo "published ${IMAGE}:sha-${SHORT}"
          echo "digest=$(cat "${RUNNER_TEMP}/digest")"
          podman logout "${REGISTRY}" || true

      # ── SBOM ──────────────────────────────────────────────────────────────
      # Deliberately AFTER the push, and that ordering is the whole safety
      # property: the image is already published when this runs, so a failure
      # here turns the run red without blocking a deployment.
      #
      # It answers the question THIRD-PARTY-NOTICES.md cannot: that file
      # covers what this repository redistributes, but an image also carries
      # every Python package pip installed at build time. Written by hand,
      # that inventory would be wrong by the second release.
      - name: SBOM of the published image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          # Through a docker-archive rather than the podman socket, which is
          # not exposed to jobs on this runner.
          podman save --format docker-archive -o "${RUNNER_TEMP}/image.tar" ghostbit:ci
          "${RUNNER_TEMP}/trivy" image \
            --input "${RUNNER_TEMP}/image.tar" \
            --format cyclonedx \
            --scanners license \
            --output "sbom-${SHORT}.cdx.json"
          python3 - "sbom-${SHORT}.cdx.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          parts = doc.get("components", [])
          print(f"{len(parts)} components in {sys.argv[1]}")
          PY

      # v3, et non v4+ : `@actions/artifact` v2 s'adresse a une API que Gitea
      # n'implemente pas, et qui repond alors comme un GitHub Enterprise Server.
      # Le premier passage a echoue exactement la-dessus (run 3099) :
      #
      #   GHESNotSupportedError: upload-artifact@v4+ [...] not supported on GHES
      #
      # L'image etait deja poussee et le SBOM deja produit ; seule sa
      # conservation manquait. C'est la raison pour laquelle cette etape vient
      # apres le push, et non avant.
      - name: Keep the SBOM with the run
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom-*.cdx.json
