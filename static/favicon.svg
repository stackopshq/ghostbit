<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Une seule forme. Le panneau est creusé dans le fantôme, les chevrons y
       sont re-remplis : `evenodd` compte les imbrications, donc corps (1) →
       panneau (2, creusé) → chevrons (3, pleins).

       Chaque chevron est un polygone unique de six points. Deux capsules qui se
       rejoindraient à la pointe repasseraient à la profondeur 4 et y creuseraient
       un cran, exactement là où l'œil cherche l'angle. -->
  <defs>
    <linearGradient id="g" x1="256" y1="48" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D067FF"/>
      <stop offset="0.5" stop-color="#BC13FE"/>
      <stop offset="1" stop-color="#7A0BA6"/>
    </linearGradient>
  </defs>

  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#g)" d="
      M 256 44
      C 152 44 84 118 84 220
      L 84 434
      C 84 462 114 476 133 456
      L 167 420
      C 180 407 199 407 212 420
      L 237 446
      C 248 458 264 458 275 446
      L 300 420
      C 313 407 332 407 345 420
      L 379 456
      C 398 476 428 462 428 434
      L 428 220
      C 428 118 360 44 256 44
      Z

      M 172.0 172.0 L 340.0 172.0 A 26 26 0 0 1 366.0 198.0 L 366.0 310.0 A 26 26 0 0 1 340.0 336.0 L 172.0 336.0 A 26 26 0 0 1 146.0 310.0 L 146.0 198.0 A 26 26 0 0 1 172.0 172.0 Z

      M 230.0 208.0 L 178.0 254.0 L 230.0 300.0 L 202.0 300.0 L 150.0 254.0 L 202.0 208.0 Z
      M 282.0 208.0 L 334.0 254.0 L 282.0 300.0 L 310.0 300.0 L 362.0 254.0 L 310.0 208.0 Z
  "/>
</svg>
